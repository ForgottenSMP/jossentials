plugins {
    id 'java'
    id 'com.gradleup.shadow' version '9.4.1'
    id("xyz.jpenilla.run-paper") version "2.3.1"
}

group = 'gg.jos'
version = '1.0.0'

repositories {
    mavenCentral()
    maven {
        name = "papermc-repo"
        url = "https://repo.papermc.io/repository/maven-public/"
    }
    maven { url = "https://repo.aikar.co/content/groups/aikar/" }
    maven { url = "https://repo.xenondevs.xyz/releases" }
}

dependencies {
    compileOnly("io.papermc.paper:paper-api:26.2.build.112-stable")
    implementation "co.aikar:acf-paper:0.5.1-SNAPSHOT" // Replace PLATFORM with bukkit, paper, sponge, etc
    implementation("xyz.xenondevs.invui:invui:2.3.0")
    implementation("com.zaxxer:HikariCP:7.0.2")
}

shadowJar {
    relocate 'co.aikar.commands', 'gg.jos.jossentials.acf'
    relocate 'co.aikar.locales', 'gg.jos.jossentials.locales'
    relocate 'com.zaxxer.hikari', 'gg.jos.jossentials.hikari'
    relocate 'xyz.xenondevs.invui', 'gg.jos.jossentials.invui'

    // InvUI ships Mojang-mapped NMS code. Shadow builds its own manifest, so the
    // namespace declaration from the InvUI jar has to be re-stated here or servers
    // that still run the legacy spigot->mojang plugin remapper would mangle it.
    manifest {
        attributes 'paperweight-mappings-namespace': 'mojang'
    }
}

build.dependsOn shadowJar

tasks {
    runServer {
        // Configure the Minecraft version for our task.
        // This is the only required configuration besides applying the plugin.
        // Your plugin's jar (or shadowJar if present) will be used automatically.
        minecraftVersion("26.2")
    }

    runPaper.folia.registerTask() {
        minecraftVersion("26.2")
    }
}

def targetJavaVersion = 25
java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'

    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        options.release.set(targetJavaVersion)
    }
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset 'UTF-8'
    filesMatching('plugin.yml') {
        expand props
    }
}
